# NOTE: kept outside .github/workflows/ (i.e. disabled) until a Tidy3D API key
# is available as the SIMCLOUD_APIKEY repository secret. Move it back into
# .github/workflows/ to enable it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # PhotonForge checks its licence against the Tidy3D API.
      SIMCLOUD_APIKEY: ${{ secrets.SIMCLOUD_APIKEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Import the built wheel in a clean environment
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "from cornerstone_forge import si_220nm_passive as cs; cs.si_220nm_passive_pdk()"
