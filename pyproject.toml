[project]
name = "csforge-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David-GERARD", email = "david.gerard.23@ucl.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "photonforge>=1.3.2",
]
[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.uv.sources]
csforge-si_220nm_active = { workspace = true }
csforge-si_220nm_passive = { workspace = true }

[tool.uv.workspace]
members = [
    "csforge-si_220nm_active",
    "csforge-si_220nm_passive",
]


[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "D",   # docstring checks
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle
    "C4",  # flake8-comprehensions
    "NPY", # numpy-specific rules
    "RUF", # ruff builtins
    "ISC", # implicit string concatenation
    "PIE", # flake8-pie
    "RSE", # unnecessary parantheses on raised exceptions
    "PLE", # pylint errors
    "PLC", # pylint conventions
]

extend-ignore = [
    "RUF001",  # ambiguous unicode characters
    "RUF002",  # ambiguous unicode characters
    "RUF003",  # ambiguous unicode characters
    "B006",    # mutable data structures for argument defaults
    "PLC0206", # Extracting value from dictionary without calling `.items()`
    "UP038",   # Unions instead of tuples in isinstance/issubclass
]

[tool.ruff.lint.pydocstyle]
convention = "google"
